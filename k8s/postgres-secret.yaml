apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: task-app
type: Opaque
# Values are base64 encoded: echo -n 'value' | base64
# postgres -> cG9zdGdyZXM=
# taskdb   -> dGFza2Ri
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: dGFza2Ri
